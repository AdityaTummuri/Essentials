name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Essentials Library Integrity
        run: |
          ./scripts/essentials validate
          resources/scripts/setup-project.sh --validate

      - name: Run CLI and Multi-Agent Adapter Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Run Resource Library Core Tests
        run: |
          python3 -m unittest discover -s resources/scripts/tests -v

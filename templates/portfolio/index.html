<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Portfolio | Essentials Starter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; z-index: 1; }
    .overlay { position: relative; z-index: 2; pointer-events: none; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 3rem; }
    header h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; }
    header p { color: #888; margin-top: 0.5rem; }
    .interactive { pointer-events: auto; }
    a { color: #fff; text-decoration: none; border-bottom: 1px solid #444; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="overlay">
    <header>
      <h1>Portfolio Starter</h1>
      <p>Three.js + Essentials Art Direction</p>
    </header>
    <footer>
      <p class="interactive">Built with <a href="https://github.com/AdityaTummuri/Essentials">Essentials</a> Toolkit.</p>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
